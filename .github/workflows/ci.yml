name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run hooks against a sample document
        shell: bash
        run: |
          hook_repo="$PWD"
          # Keep the sandbox on the same drive as the workspace: on Windows
          # runners the workspace is on D: while the default temp dir is on
          # C:, and pre-commit's relative-path computation cannot cross
          # drives.
          sandbox="$(mktemp -d -p "$RUNNER_TEMP")"
          cd "$sandbox"
          git init -q
          git config user.email ci@example.com
          git config user.name ci
          printf 'Some   text with   irregular spacing.\n' > doc.tex
          git add doc.tex
          # The first format run rewrites the file, so the hook must fail...
          if pre-commit try-repo "$hook_repo" badness-format --files doc.tex; then
            echo "expected badness-format to modify the file" >&2
            exit 1
          fi
          git add doc.tex
          # ...and a second run must be clean (idempotence).
          pre-commit try-repo "$hook_repo" badness-format --files doc.tex
          pre-commit try-repo "$hook_repo" badness-lint --files doc.tex
